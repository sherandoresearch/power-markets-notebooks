# Model-B-v1.0 — three-bus triangle (frozen baseline)
# Governed by Architecture v1.1 §4.2. Principal model is the equal-reactance
# triangle; named variants live under variants:.
model: Model-B
version: "1.0"
description: Three buses, three lines; meshed routing, PTDF, DC-OPF, duality, LMP decomposition, settlement.
buses: [1, 2, 3]
reactances:  # [i, j, x] — equal-reactance principal model
  - [1, 2, 1]
  - [1, 3, 1]
  - [2, 3, 1]
variants:
  high_reactance_direct_line:
    description: Direct line 1–3 at four times the reactance (Vol. I §3.3)
    reactances: [[1, 2, 1], [1, 3, 4], [2, 3, 1]]
exact_registry:  # verified by tests/test_exact_identities.py
  flow_split_1_to_3_direct: 0.6667   # 2/3 on the direct path, 1/3 the long way
  flow_split_1_to_3_long: 0.3333
  triangle_spectrum_unit_weights: [0, 3, 3]
notes: >
  Generator offers, loads, line limits and reference-bus conventions for the
  worked market scenarios (Vol. I §6 catalog) belong in per-scenario manifests,
  to be extracted from Vol. I Table 4.1 and §6 during the Phase 3 refactor.
used_in:
  - "Vol. I §§3–15 (all worked market numbers)"
  - "Vol. II Chs. 1–4 (discrete calculus and Hodge on the same triangle)"
